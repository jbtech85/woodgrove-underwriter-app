name: Backend CI/CD - Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/wg-underwriter-backend:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/wg-underwriter-backend:${{ github.sha }}

      - name: Configure registry on Container App
        run: |
          az containerapp registry set \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --server ${{ secrets.ACR_LOGIN_SERVER }} \
            --username ${{ secrets.ACR_USERNAME }} \
            --password ${{ secrets.ACR_PASSWORD }}

      - name: Deploy to Container App
        id: deploy
        run: |
          NEW_REVISION=$(az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/wg-underwriter-backend:${{ github.sha }} \
            --query "properties.latestRevisionName" -o tsv)
          echo "new_revision=$NEW_REVISION" >> $GITHUB_OUTPUT

      - name: Verify revision is running
        run: |
          REVISION="${{ steps.deploy.outputs.new_revision }}"
          echo "Polling revision: $REVISION"
          for i in {1..18}; do
            STATE=$(az containerapp revision show \
              --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --revision "$REVISION" \
              --query "properties.runningState" -o tsv)
            echo "Attempt $i/18 — state: $STATE"
            if [ "$STATE" = "Running" ] || [ "$STATE" = "ScaledToZero" ]; then
              echo "Revision deployed successfully (state: $STATE)."
              exit 0
            elif [ "$STATE" = "Failed" ] || [ "$STATE" = "Degraded" ]; then
              echo "Revision failed to start. Check the Container App logs in the Azure portal."
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for revision to reach a stable state."
          exit 1
